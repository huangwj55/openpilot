# 文件名: .github/workflows/sync-sunnypilot-tn-prebuilt.yml
# YAML - 使用 2 空格缩进，不要使用 Tab

name: Sync sunnypilot tn-prebuilt with modifications (using GITHUB_TOKEN)

# 0 空格缩进
on:
  # 2 空格缩进
  schedule:
    # 4 空格缩进 (列表项)
    - cron: '0 10 * * *'
  # 2 空格缩进
  workflow_dispatch:

# 0 空格缩进
jobs:
  # 2 空格缩进
  sync:
    # 4 空格缩进
    runs-on: ubuntu-latest
    # 4 空格缩进
    steps:

      # 6 空格缩进 (步骤列表项)
      - name: Checkout target repository (your repo baseline)
        # 8 空格缩进
        uses: actions/checkout@v4
        # 8 空格缩进
        with:
          # 10 空格缩进
          token: ${{ secrets.GITHUB_TOKEN }}

      # 6 空格缩进
      - name: Add sunnypilot remote and fetch tn-prebuilt branch
        # 8 空格缩进
        run: | # <-- 注意这里
          # 10 空格缩进 (run: 下面的所有行)
          git remote add sunnypilot_source https://github.com/sunnypilot/sunnypilot.git
          # 10 空格缩进
          echo "Fetching tn-prebuilt from sunnypilot..."
          # 10 空格缩进
          # 确保即使本地存在 tn-prebuilt 也获取最新远程数据
          git fetch sunnypilot_source tn-prebuilt --depth=1 --no-tags
          # 10 空格缩进
          echo "Fetch completed."

      # 6 空格缩进 (新增的关键步骤：切换工作区)
      - name: Checkout the fetched tn-prebuilt branch locally
        # 8 空格缩进
        run: | # <-- 注意这里
          # 10 空格缩进 (run: 下面的所有行)
          echo "Checking out fetched branch into working directory..."
          # 10 空格缩进
          # -B 会创建新分支或重置同名分支到指定 commit
          git checkout -B tn-prebuilt refs/remotes/sunnypilot_source/tn-prebuilt
          # 10 空格缩进
          echo "Working directory now contains tn-prebuilt content."
          # 10 空格缩进
          # git clean -fdx # 可选：清理未跟踪的文件，防止干扰

      # 6 空格缩进
      - name: Apply custom modifications using sed (revised)
        # 8 空格缩进
        run: | # <-- 注意这里
          # 10 空格缩进 (run: 下面的所有行)
          echo "Applying modifications to checked-out files..."

          # 10 空格缩进 (修改 system/athena/registration.py)
          echo "Modifying registration.py..."
          # 使用 '_' 作为 sed 分隔符，提高稳定性
          # 1. 修改 imei1 (增加 \s* 匹配可选前导空格)
          sed -i "s_^\s*imei1: str | None = None$_    imei1='865420071781912'_g" system/athena/registration.py
          # 2. 修改 imei2 (增加 \s* 匹配可选前导空格)
          sed -i "s_^\s*imei2: str | None = None$_    imei2='865420071781904'_g" system/athena/registration.py
          # 3. 注释掉 set_offroad_alert 行 (使用 _ 分隔符，替换内容是 #&)
          sed -i 's_^\s*set_offroad_alert("Offroad_UnofficialHardware",.*_#&_' system/athena/registration.py
          echo "registration.py modification attempt finished."

          # 10 空格缩进 (修改 launch_openpilot.sh，拆分为单行追加)
          echo "Modifying launch_openpilot.sh..."
          # 查找 shebang '#!/bin/bash' 的行号
          SHEBANG_LINE=$(grep -n '^#!/bin/bash' launch_openpilot.sh | cut -d: -f1)

          # 检查是否找到行号
          if [ -z "$SHEBANG_LINE" ]; then
            echo "Error: Shebang line '#!/bin/bash' not found in launch_openpilot.sh" >&2
            exit 1 # 退出脚本并标记此步骤失败
          fi

          echo "Found shebang at line $SHEBANG_LINE. Inserting export lines one by one..."

          # 检查每一行是否已存在，避免重复添加
          if ! grep -q "export API_HOST=https://api.konik.ai" launch_openpilot.sh; then
            # 使用 'a' 命令在指定行号后追加内容
            sed -i "${SHEBANG_LINE}a export API_HOST=https://api.konik.ai" launch_openpilot.sh
            echo "Inserted API_HOST."
          else
            echo "API_HOST line already exists."
          fi

          if ! grep -q "export ATHENA_HOST=wss://athena.konik.ai" launch_openpilot.sh; then
            # 再次获取行号，以防万一文件被修改 (虽然理论上这里不会)
            # 或者直接使用之前的行号，因为 'a' 命令总是在其后添加
            sed -i "${SHEBANG_LINE}a export ATHENA_HOST=wss://athena.konik.ai" launch_openpilot.sh
            echo "Inserted ATHENA_HOST."
          else
            echo "ATHENA_HOST line already exists."
          fi
          # 注意：为了保持插入顺序 (API -> ATHENA -> MAPS)，需要按这个顺序执行 sed 'a' 命令
          # 因为 sed 'a' 是追加到指定行之后，后执行的会插在更前面行的下方

          if ! grep -q "export MAPS_HOST=https://api.konik.ai/maps" launch_openpilot.sh; then
             sed -i "${SHEBANG_LINE}a export MAPS_HOST=https://api.konik.ai/maps" launch_openpilot.sh
             echo "Inserted MAPS_HOST."
          else
             echo "MAPS_HOST line already exists."
          fi

          # **重要**: 上面的逐行 sed -i "${SHEBANG_LINE}a ..." 会导致插入顺序是反的！
          # 正确的方法是按期望顺序插入，或者使用不同的行号/标记。
          # 最简单的修正：一次性用改进的多行追加，或者用更复杂的脚本逻辑。
          # 让我们尝试修正后的逐行插入逻辑：

          echo "Re-checking and inserting for correct order..."
          # 先添加最后一行
          if ! grep -q "export MAPS_HOST=https://api.konik.ai/maps" launch_openpilot.sh; then
             sed -i "${SHEBANG_LINE}a export MAPS_HOST=https://api.konik.ai/maps" launch_openpilot.sh
             echo "Inserted MAPS_HOST (pass 2)."
          fi
          # 再添加中间一行 (它会被加在 SHEBANG_LINE 之后，MAPS_HOST 之前)
          if ! grep -q "export ATHENA_HOST=wss://athena.konik.ai" launch_openpilot.sh; then
             sed -i "${SHEBANG_LINE}a export ATHENA_HOST=wss://athena.konik.ai" launch_openpilot.sh
             echo "Inserted ATHENA_HOST (pass 2)."
          fi
          # 最后添加第一行 (它会被加在 SHEBANG_LINE 之后，ATHENA_HOST 之前)
          if ! grep -q "export API_HOST=https://api.konik.ai" launch_openpilot.sh; then
             sed -i "${SHEBANG_LINE}a export API_HOST=https://api.konik.ai" launch_openpilot.sh
             echo "Inserted API_HOST (pass 2)."
          fi


          echo "launch_openpilot.sh modification attempt finished."

          # 10 空格缩进 (检查修改结果)
          echo "Modifications applied. Checking diffs..."
          echo "--- registration.py status & diff ---"
          git status --porcelain system/athena/registration.py
          git diff system/athena/registration.py || echo "No changes detected in registration.py or file not found."
          echo "--- launch_openpilot.sh status & diff ---"
          git status --porcelain launch_openpilot.sh
          git diff launch_openpilot.sh || echo "No changes detected in launch_openpilot.sh or file not found."

      # 6 空格缩进 (新增的关键步骤：提交修改)
      - name: Commit the changes
        # 8 空格缩进
        run: | # <-- 注意这里
          # 10 空格缩进 (run: 下面的所有行)
          git config --global user.name 'github-actions[bot]'
          # 10 空格缩进
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 10 空格缩进 (检查是否有更改)
          if git diff --quiet && git diff --staged --quiet; then
            # 12 空格缩进
            echo "No changes detected by sed commands or files missing. Nothing to commit."
          else
            # 12 空格缩进
            echo "Staging and committing changes..."
            # 12 空格缩进 (显式添加可能被修改的文件)
            git add system/athena/registration.py launch_openpilot.sh
            # 12 空格缩进 (再次检查暂存区)
            if git diff --staged --quiet; then
              # 14 空格缩进
              echo "Files were staged but content matches HEAD. Nothing to commit."
            else
              # 14 空格缩进
              git commit -m "Apply custom modifications after syncing from sunnypilot/tn-prebuilt"
              # 14 空格缩进
              echo "Changes committed."
            fi
          fi

      # 6 空格缩进 (修正推送目标：推送本地修改后的分支)
      - name: Force push modified tn-prebuilt to your repository
        # 8 空格缩进
        run: | # <-- 注意这里
          # 10 空格缩进 (run: 下面的所有行)
          echo "Pushing modified local tn-prebuilt to origin/tn-prebuilt..."
          # 10 空格缩进
          # 推送本地 tn-prebuilt 分支到 origin 的 tn-prebuilt 分支
          git push origin tn-prebuilt --force
          # 10 空格缩进
          echo "Push completed."
