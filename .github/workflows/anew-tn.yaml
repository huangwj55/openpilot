# 文件名: .github/workflows/sync-tn-to-tm.yaml
# YAML - 严格使用 2 空格缩进，无 Tab

name: AAA Sync sunnypilot tn to my tm
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions: # 添加权限块
      contents: write # 允许 GITHUB_TOKEN 写入仓库内容 (包括 push)
    steps:
      # ... (Checkout target repository step) ...
      - name: Checkout target repository (contains script)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # checkout 会使用这个 token
          ref: tn

      # ... (Prepare modification script step) ...
      - name: Prepare modification script
        run: |
          echo "Copying modification script to temporary location..."
          mkdir -p /tmp/workflow_scripts
          cp .github/scripts/apply_modifications.py /tmp/workflow_scripts/apply_modifications.py
          echo "Script copied to /tmp/workflow_scripts/"
          ls -l /tmp/workflow_scripts/

      # ... (Add sunnypilot remote and fetch tn branch step) ...
      - name: Add sunnypilot remote and fetch tn branch
        run: |
          git remote add sunnypilot_source https://github.com/sunnypilot/sunnypilot.git
          echo "Fetching tn from sunnypilot_source..."
          git fetch sunnypilot_source tn --depth=1 --no-tags
          echo "Fetch completed."

      # ... (Checkout the fetched tn branch locally step) ...
      - name: Checkout the fetched tn branch locally into a temporary branch (Overwrites workspace)
        run: |
          echo "Checking out fetched sunnypilot/tn branch into local temp-sync-branch..."
          git checkout -B temp-sync-branch refs/remotes/sunnypilot_source/tn
          echo "Working directory now contains sunnypilot/tn content on local temp-sync-branch."
          echo "Checking if original script path exists (it should NOT):"
          ls -l .github/scripts/apply_modifications.py || echo "Original script path no longer exists as expected."

      # ... (Apply custom modifications step) ...
      - name: Apply custom modifications using script from temp location
        run: |
          echo "Running Python script from temporary location on temp-sync-branch..."
          ls -l /tmp/workflow_scripts/apply_modifications.py
          python /tmp/workflow_scripts/apply_modifications.py
          echo "Python script execution finished."

      # ... (Commit the changes step - modified to include id and output) ...
      - name: Commit the changes to temp-sync-branch
        id: commit_changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --staged --quiet; then
             echo "Files were staged but content matches HEAD of temp-sync-branch. Skipping commit."
             echo "changes_made=false" >> $GITHUB_OUTPUT
          else
             git commit -m "Apply custom modifications after syncing from sunnypilot/tn"
             echo "Changes committed to temp-sync-branch."
             echo "changes_made=true" >> $GITHUB_OUTPUT
          fi
      
      - name: No changes to commit
        if: steps.check_status.outputs.changes_detected == 'false'
        run: echo "No file changes detected by Python script. Nothing to commit."

      - name: Force push modified tn-prebuilt to your repository
        run: |
          echo "Pushing local tn-prebuilt to origin/tn-prebuilt..."
          git push origin temp-sync-branch:tm --force
          echo "Push to origin/tm completed."
