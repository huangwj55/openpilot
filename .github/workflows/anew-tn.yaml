# 文件名: .github/workflows/sync-tn-to-tm.yaml
name: AAA Sync sunnypilot tn to my tm
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout target repository (for script, skip LFS smudge)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: tn # 确保您仓库的 'tn' 分支(或脚本所在分支)存在
                  # 并且 .github/scripts/apply_modifications.py 在此分支的该路径
          lfs: true # Install Git LFS client
          lfs-skip-smudge: true # IMPORTANT: Skip downloading LFS files for THIS checkout

      - name: Prepare modification script
        run: |
          echo "Copying modification script to temporary location..."
          mkdir -p /tmp/workflow_scripts
          cp .github/scripts/apply_modifications.py /tmp/workflow_scripts/apply_modifications.py
          echo "Script copied to /tmp/workflow_scripts/"
          ls -l /tmp/workflow_scripts/

      - name: Add sunnypilot remote and fetch its tn branch
        run: |
          git remote add sunnypilot_source https://github.com/sunnypilot/sunnypilot.git
          echo "Fetching tn from sunnypilot_source..."
          # Fetch only the tn branch from sunnypilot_source, including LFS pointers but not objects yet
          git fetch sunnypilot_source tn --depth=1 --no-tags --no-recurse-submodules
          echo "Fetch from sunnypilot_source completed."

      - name: Checkout sunnypilot/tn content into temp-sync-branch
        run: |
          echo "Checking out fetched sunnypilot/tn branch into local temp-sync-branch..."
          git checkout -B temp-sync-branch refs/remotes/sunnypilot_source/tn
          echo "Working directory now contains sunnypilot/tn content (LFS pointers)."

      - name: Download LFS objects for temp-sync-branch from sunnypilot_source
        run: |
          # Before running the script, if it needs actual LFS file content from sunnypilot
          echo "Fetching LFS objects for temp-sync-branch from sunnypilot_source..."
          # Get the commit hash of the current HEAD of temp-sync-branch
          CURRENT_COMMIT=$(git rev-parse HEAD)
          # Fetch LFS objects specifically for this commit from sunnypilot_source
          git lfs fetch sunnypilot_source $CURRENT_COMMIT
          echo "Checking out (smudging) LFS objects for temp-sync-branch..."
          # This replaces LFS pointers in the working directory with actual files
          git lfs checkout
          echo "LFS objects for temp-sync-branch downloaded and checked out."

      - name: Apply custom modifications using script from temp location
        run: |
          echo "Running Python script from temporary location on temp-sync-branch..."
          python /tmp/workflow_scripts/apply_modifications.py
          echo "Python script execution finished."

      - name: Commit the changes to temp-sync-branch
        id: commit_changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --staged --quiet; then
             echo "No effective changes to commit."
             echo "changes_made=false" >> $GITHUB_OUTPUT
          else
             git commit -m "Apply custom modifications after syncing from sunnypilot/tn"
             echo "Changes committed to temp-sync-branch."
             echo "changes_made=true" >> $GITHUB_OUTPUT
          fi

      - name: Push modified temp-sync-branch to your repository's tm branch
        if: steps.commit_changes.outputs.changes_made == 'true'
        env:
          GIT_LFS_TRACE_HTTP: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          echo "--- Running 'git lfs env' before push ---"
          git lfs env

          ORIGIN_PUSH_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          LFS_PUSH_URL="${ORIGIN_PUSH_URL}/info/lfs"

          echo "Setting remote.origin.url to: $ORIGIN_PUSH_URL"
          git config remote.origin.url "$ORIGIN_PUSH_URL"
          
          echo "Setting remote.origin.lfsurl to: $LFS_PUSH_URL"
          git config remote.origin.lfsurl "$LFS_PUSH_URL"

          echo "--- Content of .git/config AFTER LFS URL modification ---"
          cat .git/config

          echo "Pushing local temp-sync-branch to origin/tm (this will upload LFS objects too)..."
          git push origin temp-sync-branch:tm --force
          
          echo "Push to origin/tm completed."
      
      - name: No changes to push
        if: steps.commit_changes.outputs.changes_made == 'false'
        run: echo "No changes detected by Python script or sync. Nothing to push to tm."
