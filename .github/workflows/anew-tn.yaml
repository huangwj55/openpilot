# 文件名: .github/workflows/sync-tn.yaml

name: Sync sunnypilot/tn → hwj55/openpilot:tn

on:
  schedule:
    - cron: '0 10 * * *'  # 每天 UTC 时间 10:00 自动运行
  workflow_dispatch:        # 支持手动触发

jobs:
  clone-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Git
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"

    - name: Clone sunnypilot/tn branch
      run: |
        git clone --single-branch --branch tn https://github.com/sunnypilot/openpilot.git source_repo
        cd source_repo

    - name: Push to hwj55/openpilot tn branch
      run: |
        cd source_repo
        git remote rename origin upstream
        git remote add target https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/hwj55/openpilot.git
        git push -f target tn
