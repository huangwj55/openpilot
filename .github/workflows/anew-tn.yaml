# 文件名: .github/workflows/sync-tn-to-tm.yaml
name: AAA Sync sunnypilot tn to my tm
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout script from target repository (NO LFS download)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          repository: ${{ github.repository }}
          ref: tn
          lfs: false
          persist-credentials: false

      - name: Prepare modification script
        run: |
          mkdir -p /tmp/workflow_scripts
          cp .github/scripts/apply_modifications.py /tmp/workflow_scripts/apply_modifications.py

      - name: Install Git LFS client and initialize
        run: |
          sudo apt-get update -q && sudo apt-get install -y git-lfs
          # Initialize LFS, but we will skip the smudge for origin checkout
          git lfs install --skip-smudge

      - name: Add sunnypilot remote and fetch its tn branch
        run: |
          git remote add sunnypilot_source https://github.com/sunnypilot/sunnypilot.git
          git fetch sunnypilot_source tn --depth=1 --no-tags --no-recurse-submodules

      - name: Checkout sunnypilot/tn content into temp-sync-branch
        run: |
          git checkout -B temp-sync-branch refs/remotes/sunnypilot_source/tn
          echo "Checked out sunnypilot/tn content. Checking for .lfsconfig:"
          ls -l .lfsconfig || echo ".lfsconfig not found initially (will be created by script)."

      - name: Download LFS objects for temp-sync-branch from sunnypilot_source
        env:
          # Optional: useful for debugging LFS fetches
          # GIT_LFS_TRACE_HTTP: "1" 
        run: |
          # Ensure LFS fetch uses the correct remote's endpoint
          git config remote.sunnypilot_source.lfsurl "https://github.com/sunnypilot/sunnypilot.git/info/lfs"
          
          echo "Fetching LFS objects from sunnypilot_source..."
          # Fetch LFS objects for the current commit on this branch
          git lfs fetch sunnypilot_source $(git rev-parse HEAD)
          
          echo "Checking out (smudging) LFS objects..."
          # This command replaces LFS pointers with the actual file content we just fetched
          git lfs checkout
          echo "LFS objects downloaded and checked out."

      - name: Apply custom modifications (including .lfsconfig download)
        run: |
          echo "Running Python script to apply modifications..."
          # This script will re-download/overwrite .lfsconfig, ensuring it's the latest from the URL
          python /tmp/workflow_scripts/apply_modifications.py
          echo "Python script finished. Final check on .lfsconfig:"
          cat .lfsconfig

      - name: Commit the changes
        id: commit_changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Remove cached workflow files so they are not part of the commit
          git rm --cached -r .github/workflows || true
          
          git add --all .
          
          echo "Staged changes:"
          git status --short
          
          if git diff --staged --quiet; then
             echo "No effective changes to commit."
             echo "changes_made=false" >> $GITHUB_OUTPUT
          else
             # .lfsconfig is now part of the commit
             git commit -m "Sync from sunnypilot/tn and apply custom modifications"
             echo "Changes committed."
             echo "changes_made=true" >> $GITHUB_OUTPUT
          fi

      - name: Push modified branch to your repository's tm branch (Git objects ONLY)
        if: steps.commit_changes.outputs.changes_made == 'true'
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          ORIGIN_REPO_URL_WITH_TOKEN="https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git"
          
          echo "Pushing ONLY Git objects (commits, trees) to origin/tm..."
          # We use a standard git push. The pre-push hook for LFS will trigger,
          # but since there is no lfsurl for origin and .lfsconfig points to sunnypilot,
          # it should not attempt to push to your repository.
          # To be absolutely safe, we can explicitly skip the LFS push hook.
          git -c filter.lfs.process="" push "$ORIGIN_REPO_URL_WITH_TOKEN" temp-sync-branch:tm --force
          echo "Push completed."
      
      - name: No changes to push
        if: steps.commit_changes.outputs.changes_made == 'false'
        run: echo "No changes. Nothing to push."
