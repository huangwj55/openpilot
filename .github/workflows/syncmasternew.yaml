# 文件名: .github/workflows/sync-tn-prebuilt.yaml
# YAML - 严格使用 2 空格缩进，无 Tab

name: AAA Sync sunnypilot master-new

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout target repository (contains script)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: tn # 明确指定签出 tn 分支，确保拿到脚本

      - name: Prepare modification script
        run: |
          echo "Copying modification script to temporary location..."
          mkdir -p /tmp/workflow_scripts
          cp .github/scripts/apply_modifications.py /tmp/workflow_scripts/apply_modifications.py
          echo "Script copied to /tmp/workflow_scripts/"
          ls -l /tmp/workflow_scripts/

      - name: Add sunnypilot remote and fetch master-new branch
        run: |
          git remote add sunnypilot_source https://github.com/sunnypilot/sunnypilot.git
          echo "Fetching master-new from sunnypilot..."
          git fetch sunnypilot_source master-new --depth=1 --no-tags
          echo "Fetch completed."

      - name: Checkout the fetched master-new branch locally (Overwrites workspace)
        run: |
          echo "Checking out fetched branch into working directory..."
          git checkout -B master-new refs/remotes/sunnypilot_source/master-new
          echo "Working directory now contains master-new content."
          echo "Checking if original script path exists (it should NOT):"
          ls -l .github/scripts/apply_modifications.py || echo "Original script path no longer exists as expected."

      - name: Apply custom modifications using script from temp location
        run: |
          echo "Running Python script from temporary location..."
          ls -l /tmp/workflow_scripts/apply_modifications.py
          python /tmp/workflow_scripts/apply_modifications.py
          echo "Python script execution finished."

      - name: Check file status after modification script
        id: check_status
        run: |
          echo "Checking git status for modified files..."
          git status --porcelain system/athena/registration.py launch_openpilot.sh
          if [[ -n $(git status --porcelain system/athena/registration.py launch_openpilot.sh) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit the changes
        if: steps.check_status.outputs.changes_detected == 'true'
        run: |
          echo "Changes detected. Staging and committing..."
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --staged --quiet; then
            echo "Files were staged but content matches HEAD. Skipping commit."
          else
            git commit -m "O3注册/MAPS API/stop distance/some op long"
            echo "Changes committed."
          fi

      - name: No changes to commit
        if: steps.check_status.outputs.changes_detected == 'false'
        run: echo "No file changes detected by Python script. Nothing to commit."

      - name: Force push modified tn-prebuilt to your repository
        run: |
          echo "Pushing local tn-prebuilt to origin/tn-prebuilt..."
          git push origin master-new --force
          echo "Push completed."
