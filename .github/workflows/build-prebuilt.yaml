name: Build and Create tn-prebuilt Branch

on:
  workflow_dispatch:
    inputs:
      ref_to_build:
        description: 'The branch or commit SHA to build (default: tn)'
        required: true
        default: 'tn'
  push:
    branches:
      - tn

jobs:
  build_and_push_prebuilt:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Ref to Checkout
        id: vars
        run: |
          # ... (保持不变) ...
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.ref_to_build }}" >> $GITHUB_OUTPUT
            echo "source_desc=ref '${{ github.event.inputs.ref_to_build }}'" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
            echo "source_desc=branch '${{ github.ref_name }}'" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.ref }}
          submodules: true
          lfs: false # 手动 pull lfs

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # 确认版本
          cache: 'pip' # 启用 pip 缓存加速后续构建

       # 步骤 1: 安装核心系统依赖 (APT)
      - name: Install Core System Dependencies (APT)
        run: |
          echo "Installing core system dependencies via apt..."
          sudo apt-get update -y
          # 基本构建工具、SCons、Git LFS 和一些常见库
          # 确保即使脚本失败，这些核心工具也存在
          sudo apt-get install -y --no-install-recommends \
            scons \
            git-lfs \
            build-essential \
            libffi-dev \
            libssl-dev \
            libzmq3-dev \
            libsdl2-dev \
            libqt5svg5-dev \
            qttools5-dev
          echo "Core system dependencies installed."

      # --- 新增步骤: 运行仓库自带的设置脚本 ---
      - name: Run ubuntu_setup.sh Script
        run: |
          SETUP_SCRIPT="tools/ubuntu_setup.sh"
          if [ -f "$SETUP_SCRIPT" ]; then
            echo "Running $SETUP_SCRIPT..."
            chmod +x $SETUP_SCRIPT
            # 执行脚本，如果失败则终止 workflow (因为用户确认它是有效的)
            ./$SETUP_SCRIPT || exit 1
            echo "$SETUP_SCRIPT executed successfully."
          else
            # 如果脚本不存在，根据你的确认，这可能是一个问题
            echo "Error: Dependency setup script $SETUP_SCRIPT not found!"
            exit 1 # 强制失败，因为脚本被认为是必要的
          fi
      # --- 结束新增步骤 ---

        # 步骤 3: 使用 pip 安装 Python 依赖 (来自 pyproject.toml)
      - name: Install Python Dependencies (Pip from pyproject.toml)
        run: |
          echo "Installing Python dependencies via pip from pyproject.toml..."
          # 升级 pip, wheel, setuptools 很重要，确保能良好处理 pyproject.toml
          python -m pip install --upgrade pip wheel setuptools

          # --- 检查 pyproject.toml 是否存在 ---
          if [ -f "pyproject.toml" ]; then
            echo "Found pyproject.toml. Installing dependencies defined within..."
            # 使用 '.' 指示 pip 从当前目录安装项目及其依赖
            # pip 会自动查找 pyproject.toml 并根据其内容安装
            # 如果你的 pyproject.toml 定义了可选依赖 (extras) 且构建需要它们,
            # 可能需要类似 pip install .[dev] 或 .[test] 的命令
            # 但通常 pip install . 会安装核心运行时依赖
            pip install .
          else
            # 如果连 pyproject.toml 都没有，依赖安装将失败
            echo "Error: pyproject.toml not found in the repository root!"
            exit 1
          fi
          echo "Python dependencies installed based on pyproject.toml."


      # 步骤 4: 拉取 Git LFS 文件
      - name: Pull Git LFS files
        run: |
          git lfs pull
          echo "Git LFS files pulled."

      # 步骤 5: (可选) 检查环境用于调试
      - name: Check Environment before SCons
        run: |
          echo "Which Python:"
          which python
          echo "Python Version:"
          python --version
          echo "Which scons:"
          which scons
          echo "Installed packages (pip list):"
          pip list | grep numpy # 检查 numpy 是否在列表里
          echo "Attempting to import numpy:"
          python -c "import numpy; print('Successfully imported numpy version:', numpy.__version__)" || exit 1

      # 步骤 6: 构建 openpilot (scons)
      - name: Build openpilot (scons)
        run: |
          echo "Starting build..."
          scons -j$(nproc)
          echo "Build finished."

      # --- 以下步骤用于创建和推送 prebuilt 分支 ---

      - name: Configure Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create or Checkout tn-prebuilt branch
        run: |
          # 切换到一个新的或已存在的 tn-prebuilt 分支
          git checkout -B tn-prebuilt
          echo "Switched to tn-prebuilt branch."

      - name: Add all files (including build artifacts)
        run: |
          # 注意 .gitignore 规则，可能需要强制添加 (-f) 被忽略的构建产物
          git add -A .
          echo "Added all files to staging area."

      - name: Commit changes
        run: |
          # 检查是否有文件变动需要提交
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            # 获取实际检出代码的 commit SHA
            CHECKED_OUT_SHA=$(git rev-parse HEAD)
            # 创建提交，包含源引用信息和 SHA
            git commit -m "Prebuilt artifacts for ${{ steps.vars.outputs.source_desc }} (commit ${CHECKED_OUT_SHA})"
            echo "Committed changes."
          fi

      - name: Push tn-prebuilt branch
        run: |
          echo "Pushing tn-prebuilt branch..."
          git push origin tn-prebuilt --force
          echo "tn-prebuilt branch pushed successfully."
