name: Build Filtered tn-prebuilt Branch

on:
  workflow_dispatch:
    inputs:
      ref_to_build:
        description: 'The branch or commit SHA to build (default: tn)'
        required: true
        default: 'tn'
  push:
    branches:
      - tn

jobs:
  build_and_publish_filtered_prebuilt:
    runs-on: ubuntu-latest # Use standard GitHub Runner
    permissions:
      contents: write # Needed to push the branch

    steps:
      # --- Standard Setup Steps ---
      - name: Determine Ref to Checkout
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.ref_to_build }}" >> $GITHUB_OUTPUT
            echo "source_desc=ref '${{ github.event.inputs.ref_to_build }}'" >> $GITHUB_OUTPUT
            SOURCE_SHA=$(git ls-remote https://github.com/${{ github.repository }}.git ${{ github.event.inputs.ref_to_build }} | awk '{ print $1 }')
          else
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
            echo "source_desc=branch '${{ github.ref_name }}'" >> $GITHUB_OUTPUT
            SOURCE_SHA=${{ github.sha }}
          fi
          # Store source SHA for commit message later
          echo "source_sha=$SOURCE_SHA" >> $GITHUB_OUTPUT
          echo "Checkout ref: ${{ steps.vars.outputs.ref }}"
          echo "Source SHA: ${{ steps.vars.outputs.source_sha }}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.ref }}
          submodules: true
          lfs: false # Pull LFS manually later

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Or '3.10', '3.11' - Ensure compatibility with numpy>=2.0 if needed
          cache: 'pip'
          
      # --- NEW: Install Cross-Compilation Tools and aarch64 Libraries ---
      - name: Install Cross-Compile Tools & aarch64 Dependencies
        run: |
          echo "Setting up for aarch64 cross-compilation..."
          sudo apt-get update -y
          # Install essential cross-compilation tools
          sudo apt-get install -y --no-install-recommends \
            crossbuild-essential-arm64 \
            pkg-config-aarch64-linux-gnu \
            rsync git-lfs # Keep rsync and git-lfs

          # Enable arm64 architecture for foreign libraries
          sudo dpkg --add-architecture arm64
          sudo apt-get update -y

          # Install aarch64 versions of necessary libraries
          # !!! This list needs to be accurate based on ALL project dependencies !!!
          # You might need to add more based on build errors.
          sudo apt-get install -y --no-install-recommends \
            libffi-dev:arm64 \
            libssl-dev:arm64 \
            libzmq3-dev:arm64 \
            libsdl2-dev:arm64 \
            # Qt dependencies might be tricky, install core dev tools first
            qtbase5-dev:arm64 \
            libqt5svg5-dev:arm64 \
            qttools5-dev:arm64 \
            # Add any other -dev packages your project links against, with :arm64 suffix
            # Example: libcurl4-openssl-dev:arm64, libarchive-dev:arm64, libusb-1.0-0-dev:arm64 etc.

          echo "Cross-compilation environment setup complete."
          # Verify toolchain existence
          aarch64-linux-gnu-gcc --version

      - name: Install Python Dependencies (Pip from pyproject.toml)
        run: |
          echo "Installing Python dependencies via pip from pyproject.toml..."
          python -m pip install --upgrade pip wheel setuptools
          if [ -f "pyproject.toml" ]; then
            pip install .
          else
            echo "Error: pyproject.toml not found!"
            exit 1
          fi
          echo "Python dependencies installed."

      - name: Pull Git LFS files
        run: git lfs pull

      # --- Build Step ---
      - name: Build openpilot (Cross-Compile for aarch64)
        id: build
        run: |
          echo "Starting aarch64 cross-compilation..."
          # Explicitly tell scons to use the aarch64 cross-compiler
          # Also potentially set AGNOS=0 if needed to avoid larch64 specific paths
          export AGNOS=0 # Assume we want generic aarch64 build
          scons -j$(nproc) \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib \
            LINK=aarch64-linux-gnu-g++ \
            PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig \
            || exit 1
            # You might need to add platform specific CFLAGS/CXXFLAGS here if required
            # Example: CFLAGS='-march=armv8-a' CXXFLAGS='-march=armv8-a'

          touch prebuilt_marker # Keep this marker if desired
          echo "Build finished."
          # Get version (保持不变)
          # ... (version extraction logic) ...
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # --- Filtering Step ---
      - name: Prepare Filtered Output Directory
        run: |
          FILTERED_OUTPUT_DIR="${{ github.workspace }}/filtered_output"
          echo "Creating filtered output directory: $FILTERED_OUTPUT_DIR"
          mkdir -p "$FILTERED_OUTPUT_DIR"

          echo "Running rsync to filter files..."
          # --- Start of Rsync rules (copied & adapted from sunnypilot workflow) ---
          rsync -am --delete \
            --include='**/panda/board/' \
            --include='**/panda/board/obj' \
            --include='**/panda/board/obj/panda.bin.signed' \
            --include='**/panda/board/obj/panda_h7.bin.signed' \
            --include='**/panda/board/obj/bootstub.panda.bin' \
            --include='**/panda/board/obj/bootstub.panda_h7.bin' \
            --exclude='.sconsign.dblite' \
            --exclude='*.a' \
            --exclude='*.o' \
            --exclude='*.os' \
            --exclude='*.pyc' \
            --exclude='moc_*' \
            --exclude='*.cc' \
            --exclude='Jenkinsfile' \
            --exclude='supercombo.onnx' \
            --exclude='**/panda/board/*' \
            --exclude='**/panda/board/obj/**' \
            --exclude='**/panda/certs/' \
            --exclude='**/panda/crypto/' \
            --exclude='**/release/' \
            --exclude='**/.github/' \
            --exclude='**/selfdrive/ui/replay/' \
            --exclude='**/__pycache__/' \
            --exclude='**/selfdrive/ui/*.h' \
            --exclude='**/selfdrive/ui/**/*.h' \
            --exclude='**/selfdrive/ui/qt/offroad/sunnypilot/' \
            # --exclude='${{env.SCONS_CACHE_DIR}}' # Removed, cache dir not used here
            --exclude='**/.git/' \
            --exclude='**/SConstruct' \
            --exclude='**/SConscript' \
            --exclude='**/.venv/' \
            --exclude='filtered_output/' \
            --exclude='prebuilt_marker' \
            # --- End of Rsync rules ---
            "${{ github.workspace }}/" "$FILTERED_OUTPUT_DIR/" # Source: workspace, Dest: filtered_output

          echo "Files after filtering in $FILTERED_OUTPUT_DIR:"
          ls -lR "$FILTERED_OUTPUT_DIR" | head -n 30 # List some filtered files for inspection

      # --- Git Publishing Steps (Using Orphan Branch for Cleanliness) ---
      - name: Configure Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create and Populate Orphan Branch
        run: |
          TARGET_BRANCH="tn-prebuilt"
          TEMP_BRANCH="${TARGET_BRANCH}-temp-build"
          FILTERED_OUTPUT_DIR="${{ github.workspace }}/filtered_output"

          echo "Creating orphan branch $TEMP_BRANCH..."
          git checkout --orphan $TEMP_BRANCH

          echo "Cleaning workspace for orphan branch..."
          # Remove all tracked files from index and working directory
          git rm -rf . || true
          # Remove all untracked files and directories (except .git)
          git clean -xdff

          echo "Copying filtered files from $FILTERED_OUTPUT_DIR to workspace root..."
          # Use -a to preserve permissions etc., dot at end is crucial
          rsync -a "$FILTERED_OUTPUT_DIR/" .

          echo "Staging files..."
          git add -A .

          echo "Git status:"
          git status --porcelain

      - name: Commit Filtered Files
        run: |
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes detected after filtering. Skipping commit and push."
            # Optionally exit successfully or with a specific code/message
            exit 0 # Exit successfully, nothing to push
          else
            echo "Committing filtered files..."
            COMMIT_MSG="Filtered prebuilt for ${{ steps.vars.outputs.source_desc }} (${{ steps.vars.outputs.source_sha }})\n\nVersion: ${{ steps.build.outputs.version }}"
            git commit -m "$COMMIT_MSG"
            echo "Commit created."
          fi

      - name: Push Filtered Branch
        run: |
          TARGET_BRANCH="tn-prebuilt"
          TEMP_BRANCH="${TARGET_BRANCH}-temp-build"

          # Check if the commit step produced a commit (might have skipped if no changes)
          if ! git rev-parse HEAD > /dev/null 2>&1; then
             echo "No commit found on $TEMP_BRANCH. Skipping push."
             exit 0
          fi

          echo "Force pushing $TEMP_BRANCH to remote $TARGET_BRANCH..."
          # Push the local temporary orphan branch to the actual target branch name on remote
          git push --force origin $TEMP_BRANCH:$TARGET_BRANCH
          echo "Filtered branch $TARGET_BRANCH pushed successfully."
